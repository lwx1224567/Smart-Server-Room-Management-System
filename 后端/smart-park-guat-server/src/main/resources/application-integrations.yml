# 可选的外部服务配置：启动后端时添加 --spring.profiles.active=integrations 启用。
# 接口地址留空时，对应外部服务不启用；密钥从后端环境变量读取。
# ${环境变量名:默认值} 表示优先读取环境变量；冒号后为空表示默认值为空。
integration:
  # 大模型服务：用于小维理解指令和生成回复。
  model:
    # 完整的聊天接口地址，例如 https://api.deepseek.com/chat/completions。
    url: ${INTEGRATION_MODEL_URL:}
    # 大模型名称，填写服务商支持的模型标识。
    name: ${INTEGRATION_MODEL_NAME:}
    # 大模型 API 密钥，通过环境变量设置，不要将真实密钥写入本文件。
    key: ${INTEGRATION_MODEL_KEY:}
  # 视频网关：用于获取摄像头视频播放地址。
  video:
    # 视频网关接口地址。
    url: ${INTEGRATION_VIDEO_URL:}
    # 视频网关访问密钥。
    key: ${INTEGRATION_VIDEO_KEY:}
  # 设备控制网关：用于向真实设备发送控制命令并获取执行结果。
  control:
    # 设备控制网关接口地址。
    url: ${INTEGRATION_CONTROL_URL:}
    # 设备控制网关访问密钥。
    key: ${INTEGRATION_CONTROL_KEY:}
  # 数据采集服务：用于定时获取设备监测数据。
  collector:
    # 数据采集服务接口地址。
    url: ${INTEGRATION_COLLECTOR_URL:}
    # 数据采集服务访问密钥。
    key: ${INTEGRATION_COLLECTOR_KEY:}
    # 采集任务执行间隔，单位为毫秒；默认 60000 毫秒，即 60 秒。
    interval-ms: ${INTEGRATION_COLLECTOR_INTERVAL_MS:60000}
