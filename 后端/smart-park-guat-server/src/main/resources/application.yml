# 设置服务器端口
server:
  port: 8080
# 本地演示使用机房 1 的 A-01；部署时可用 CONSOLE_DEMO_ROOM_ID 覆盖，设为空可关闭。
console:
  demo:
    room-id: "${CONSOLE_DEMO_ROOM_ID:1}"
# 数据库连接配置
spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    # MySQL数据库驱动类名
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接URL，包含连接参数
    url: jdbc:mysql://localhost:3306/platform_smart_park?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    # 数据库用户名
    username: ${DB_USERNAME:root}
    # 数据库密码
    password: ${DB_PASSWORD:}
#驼峰命名
mybatis:
  configuration:
    map-underscore-to-camel-case: true
